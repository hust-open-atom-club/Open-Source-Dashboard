name: Publish GHCR image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize publications across all dispatch refs so they cannot race latest.
concurrency:
  group: publish-ghcr-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Resolve image names and main revision
        id: image
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Use the checked-out workspace, not build-push-action's dispatch Git ref.
      # Build both images successfully before publishing either one.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.image.outputs.prefix }}/backend:sha-${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.prefix }}/backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=dashboard-backend
          cache-to: type=gha,mode=max,scope=dashboard-backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.image.outputs.prefix }}/frontend:sha-${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.prefix }}/frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=dashboard-frontend
          cache-to: type=gha,mode=max,scope=dashboard-frontend

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish both images
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          MAIN_SHA: ${{ steps.image.outputs.sha }}
        run: |
          # Publish both commit tags before moving either latest tag.
          for tag in "sha-${MAIN_SHA}" latest; do
            for service in backend frontend; do
              docker push "${IMAGE_PREFIX}/${service}:${tag}"
            done
          done
          {
            echo "### Published main revision: ${MAIN_SHA}"
            for service in backend frontend; do
              echo "- ${IMAGE_PREFIX}/${service}:sha-${MAIN_SHA}"
              echo "- ${IMAGE_PREFIX}/${service}:latest"
            done
          } >> "$GITHUB_STEP_SUMMARY"
